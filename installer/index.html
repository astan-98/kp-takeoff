<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KP Installer — preview</title>
<style>
:root{--bg:#f4f3f3;--card:#fff;--ink:#141212;--mut:#5e5a5a;--line:#d6d2d2;--acc:#c8102e;--ok:#17713a;--warn:#a05f00;--bad:#b3261e;--chip:#e9e7e7;--blue:#2f6fd6}
@media (prefers-color-scheme:dark){:root{--bg:#0b0a0a;--card:#1a1818;--ink:#f6f3f3;--mut:#b3adad;--line:#383434;--acc:#ff4a50;--ok:#4cc27a;--warn:#f0ad40;--bad:#ff6b63;--chip:#2a2727;--blue:#6aa0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center}
header b{font-size:1.05rem;margin-right:auto}header select{font:inherit;font-size:.9rem;padding:6px;border-radius:10px;border:0;max-width:62%}
.banner{background:#fff3cd;color:#5c4400;font-size:.78rem;padding:5px 12px;text-align:center}
main{max-width:720px;margin:0 auto;padding:12px 12px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
h1{font-size:1.45rem;margin:6px 0 2px}h2{font-size:1.15rem;margin:0 0 6px}
.mut{color:var(--mut)}.small{font-size:.85rem}
.step{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
button{font:inherit;font-size:1.05rem;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.big{width:100%;min-height:68px;font-size:1.2rem;font-weight:800;margin-top:12px;border-radius:16px}
.p{background:var(--acc);border-color:var(--acc);color:#fff}.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.act{display:block;width:100%;min-height:62px;text-align:left;font-weight:700;margin-top:10px}
.act.lab{border-color:var(--blue)}.act.mat{border-color:var(--warn)}.act.need{border-color:var(--bad)}.act.done{border-color:var(--ok)}
.link{background:none;border:0;min-height:40px;color:var(--mut);font-size:.9rem;text-decoration:underline;padding:4px}
.job{display:block;width:100%;text-align:left;min-height:84px;padding:14px 16px;margin-top:10px;background:var(--card);border-radius:16px}
.job .a{font-size:1.15rem;font-weight:800}.job .s{font-size:.95rem;color:var(--mut);margin-top:4px}
.lock{text-align:center;padding:34px 14px}.lock .ico{font-size:3rem}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--chip)}
.pill.ok{background:var(--ok);color:#fff}.pill.warn{background:var(--warn);color:#fff}.pill.bad{background:var(--bad);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px}label{display:block;font-weight:700;margin:12px 0 4px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumb{width:60px;height:60px;border-radius:10px;background:linear-gradient(135deg,#7a9,#365);color:#fff;font-size:.62rem;display:flex;align-items:flex-end;padding:3px;position:relative}
.thumb.mk::after{content:"✎";position:absolute;top:2px;right:5px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-size:.95rem;max-width:92%;z-index:30;box-shadow:0 4px 16px #0007}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.bar button{flex:1;border:0;border-radius:0;background:none;min-height:66px;font-size:.8rem;font-weight:800;color:var(--mut);padding:4px}
.bar button .i{display:block;font-size:1.35rem}.bar button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
details summary{font-weight:800;min-height:48px;display:flex;align-items:center;cursor:pointer}
.cal{overflow-x:auto;margin:10px -12px;padding:0 12px}.cal table{min-width:740px;border-collapse:separate;border-spacing:6px}
.cal th{border:0;font-size:.85rem;text-align:center}.cal th.tm{color:var(--acc)}
.cal td{border:2px dashed var(--line);border-radius:12px;min-width:104px;height:96px;padding:6px;background:var(--card);font-size:.78rem;cursor:pointer}
.cal td.tm{border-color:var(--acc)}.cal td.over{background:var(--chip);border-style:solid;border-color:var(--blue)}
.cal td.crew{border:0;background:none;cursor:default;font-size:.9rem;min-width:84px}
.cal .f.sel{outline:3px solid var(--blue);background:var(--blue);color:#fff}
.cal .f{cursor:grab;touch-action:manipulation;min-height:28px;line-height:22px;background:var(--chip);border-radius:8px;padding:3px 5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .plus{color:var(--mut);text-align:center;margin-top:4px}
.tag{font-size:.7rem;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--chip);margin-left:4px}
.tag.emp{background:var(--blue);color:#fff}
</style></head><body>
<header><b>KP Installer</b><button id="lang" style="min-height:36px;padding:4px 10px;font-size:.8rem;border-radius:10px;border:0">ES / EN</button><select id="who" aria-label="Who is using the app"></select></header>
<div class="banner">PREVIEW · sample data · nothing is sent · switch user at top ↑</div>
<main id="app"></main>
<input type="file" id="fpick" multiple accept=".pdf,image/*,.xlsx" hidden>
<script>
"use strict";
let LANG=(()=>{try{return localStorage.getItem("kpPrevLang")||"en";}catch(e){return "en";}})();const L=(es,en)=>LANG==="es"?es:en;
const OFFICE_LABEL="33 Apex Dr, Jefferson, GA";
const REPS={asher:"Asher",lance:"Lance"};
// Each rep runs the same pattern: two piece-rate sub crews (Jorge, Santos) + one employee crew in training (Sammy).
const CREWS={};
["asher","lance"].forEach(r=>[["jorge","Jorge","sub"],["santos","Santos","sub"],["sammy","Sammy","emp"]].forEach(([k,n,t])=>CREWS[r+"_"+k]={name:n,rep:r,type:t}));
const crewLabel=c=>CREWS[c].name+" ("+REPS[CREWS[c].rep]+")";
const typeTag=c=>CREWS[c].type==="emp"?'<span class="tag emp">Employee · training</span>':'<span class="tag">Sub · piece rate</span>';
// Work days Mon–Sat. Day index = week*6 + (0 Mon … 5 Sat); week 0 starts Mon 11/2/2026. Weeks -4 … +12 available.
const WK0=new Date(2026,10,2),DOW_ES=["Lun","Mar","Mié","Jue","Vie","Sáb"],DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat"];
const dayDate=i=>{const w=Math.floor(i/6),d=((i%6)+6)%6;return new Date(WK0.getFullYear(),WK0.getMonth(),WK0.getDate()+w*7+d);};
const DAYS=new Proxy({},{get:(_,i)=>{const t=dayDate(+i);return DOW_ES[((+i%6)+6)%6]+" "+t.getDate();}});
const DAYS_EN=new Proxy({},{get:(_,i)=>{const t=dayDate(+i);return DOW_EN[((+i%6)+6)%6]+" "+(t.getMonth()+1)+"/"+t.getDate();}});
const TOM=0; // tomorrow = Mon 11/2
let JID=100;
function mkJob(crew,day,addr,cust,miles,nc,lines,load,file,coords){return{id:++JID,crew,day,addr,cust,miles,nc,lines,load,coords:coords||"",file:file||null,
  checkedIn:false,checkinMiles:null,photos:[],wallPhotos:0,crawlPhoto:false,notes:[],labor:[],short:[],done:false};}
const fresh=()=>{const J=[
  mkJob("asher_jorge",0,"2009 Massey Ln, Winder, GA","Brookstone Homes",21,true,[["Paredes 2x4","R-13 sin papel 15\"","1,840 SF"],["Ático","Soplado R-38","2,150 SF"],["Crawl (piso)","R-19 16\"","1,600 SF"],["Deflectores (baffles)","Baffles 22\"","24 ea"],["Sellado de aire","Masilla y espuma","1 casa"],["Tinas","Pre-colgado (prehang)","2 ea"]],[["R-13 15\"",23,"bultos"],["Soplado R-38",31,"bolsas"],["R-19 16\"",14,"bultos"]],"WO - 2009 Massey Ln.pdf","34.0012, -83.7201"),
  mkJob("asher_jorge",0,"145 Lakeview Dr, Commerce, GA","Daniel & Rosa Pike",47,false,[["Retiro de insulación vieja","Remoción","1,300 SF"],["Ático retro","Soplado R-38 encima","1,300 SF"]],[["Soplado R-38",19,"bolsas"]],"WO - 145 Lakeview.pdf"),
  mkJob("asher_santos",0,"88 Pine Ridge Ct, Hoschton, GA","Rockhaven Builders",18,true,[["Paredes 2x6","R-19 sin papel 15\"","2,210 SF"],["Crawl (piso)","R-19 16\"","1,450 SF"],["Crawl","Poly 6 mil","1,450 SF"],["Crawl","Ventilas poly","6 ea"],["Paredes de sonido","Lana de roca (Rockwool)","400 SF"]],[["R-19 15\"",30,"bultos"],["R-19 16\"",13,"bultos"]],"WO - 88 Pine Ridge.pdf"),
  mkJob("asher_sammy",0,"17 Oak St, Jefferson, GA","Mary Collins",4,false,[["Ático","Soplado R-38","900 SF"]],[["Soplado R-38",13,"bolsas"]],"WO - 17 Oak St.jpg"),
  mkJob("asher_jorge",1,"301 Hwy 124, Braselton, GA","Brookstone Homes",26,true,[["Paredes 2x4","R-13","1,700 SF"]],[["R-13 15\"",21,"bultos"]],"WO - 301 Hwy 124.pdf"),
  mkJob("lance_jorge",0,"512 Old Federal Rd, Dahlonega, GA","Mountain Crest LLC",63,true,[["Paredes 2x4","R-13 sin papel 15\"","1,500 SF"],["Ático","Soplado R-38","1,900 SF"]],[["R-13 15\"",19,"bultos"],["Soplado R-38",27,"bolsas"]],"WO - 512 Old Federal.pdf","34.5321, -83.9851"),
  mkJob("lance_santos",0,"9 Creekside Way, Gainesville, GA","Harbor Homes",29,false,[["Línea de techo","Espuma celda abierta 5.5\"","2,640 SF"]],[["Espuma celda abierta","2,640","SF"]],"WO - 9 Creekside.pdf"),
  mkJob("lance_sammy",0,"240 Main St, Commerce, GA","Tom Reeves",44,false,[["Ático","Soplado R-30","1,100 SF"]],[["Soplado R-30",12,"bolsas"]],"WO - 240 Main St.pdf"),
];const C={};Object.keys(CREWS).forEach(k=>C[k]=false);
return{jobs:J,confirmed:Object.assign({},C),recapDone:Object.assign({},C),recap:{},crewNotifs:{},inbox:[],offline:false,queue:0,
  notifPrefs:{asher:{ready:true,labor:true,short:true,photo:true,complete:false},lance:{ready:true,labor:true,short:true,photo:false,complete:true}},
  tab:{asher:"cal",lance:"cal"},openJob:null};};
let S=fresh();
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=()=>new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function h(html){const d=document.createElement("div");d.innerHTML=html;$("#app").appendChild(d);return d;}
function sheet(html,wire){const m=document.createElement("div");m.className="modal";m.innerHTML='<div class="sheet">'+html+'<button class="link x" style="display:block;margin:14px auto 0">Cerrar / Close</button></div>';m.onclick=e=>{if(e.target===m)m.remove();};m.querySelector(".x").onclick=()=>m.remove();document.body.appendChild(m);wire&&wire(m);return m;}
// Spanish → English for office (stand-in for real translation on ingest)
const DICT=[["tuvimos que","we had to"],["no estaba","wasn't there"],["todo bien","all good"],["falta material","short on material"],["material equivocado","wrong material"],["faltan","missing"],["falta","missing"],["bultos","bundles"],["bolsas","bags"],["paredes","walls"],["pared","wall"],["ático","attic"],["mucha","a lot of"],["basura","trash"],["limpiar","clean up"],["sacar","remove"],["vieja","old"],["viejo","old"],["insulación","insulation"],["aislamiento","insulation"],["casa","house"],["cliente","customer"],["llegamos","we arrived"],["terminamos","we finished"],["mañana","tomorrow"],["hoy","today"],["necesitamos","we need"],["sobró","left over"],["más","more"],["y","and"],["la","the"],["el","the"],["de","of"],["en","in"],["con","with"]];
const LAB_EN_CREW={s:"A little more",m:"Quite a bit more",l:"A lot more",x:"Way more"};
DICT.unshift(["deflectores","baffles"],["sellado de aire","air seal"],["masilla y espuma","caulk and foam"],["pre-colgado","prehang"],["tinas","tubs"],["retiro de insulación vieja","old insulation removal"],["remoción","removal"],["ventilas poly","poly vents"],["lana de roca","rockwool"],["paredes de sonido","sound walls"],["casa","house"],["espuma celda abierta","open cell foam"],["sin papel","unfaced"],["soplado","blown"],["encima","on top"],["línea de techo","roofline"],["ático retro","attic retro"],["crawl (piso)","crawl (floor)"],["piso","floor"],["ver archivo","see file"]);
const tr=x=>LANG==="es"?x:toEN(String(x));
function toEN(es){let t=" "+es.toLowerCase()+" ";DICT.forEach(([a,b])=>{t=t.replace(new RegExp("([\\s,.;:!?])"+a+"(?=[\\s,.;:!?])","g"),"$1"+b);});t=t.trim();return t.charAt(0).toUpperCase()+t.slice(1);}
function ping(rep,kind,text){S.inbox.unshift({rep,kind,text,t:now(),pushed:!!S.notifPrefs[rep][kind]});}
const mileTier=m=>m>=60?50:m>=40?25:0;
function fillWho(){const w=$("#who");w.innerHTML='<optgroup label="Office (English)"><option value="office:asher">Asher (office)</option><option value="office:lance">Lance (office)</option></optgroup><optgroup label="Crews">'+Object.keys(CREWS).map(k=>`<option value="crew:${k}">${crewLabel(k)}</option>`).join("")+'</optgroup>';w.onchange=()=>{S.openJob=null;render();};}
function render(){const[k,id]=$("#who").value.split(":");document.documentElement.lang=k==="crew"?"es":"en";$("#app").innerHTML="";document.querySelectorAll(".bar").forEach(b=>b.remove());k==="crew"?crew(id):office(id);}
function go(){render();window.scrollTo(0,0);}

/* ===================== CREW (Spanish) ===================== */
function crew(c){
  const C=CREWS[c],rep=REPS[C.rep],jobs=S.jobs.filter(j=>j.crew===c&&j.day===TOM);
  if(S.openJob)return crewJob(c,S.jobs.find(j=>j.id===S.openJob));
  if(!S.confirmed[c]){h(`<div class="card lock"><div class="ico">🔒</div><h1>${L("Ma\u00f1ana todav\u00eda no est\u00e1 listo","Tomorrow isn't ready yet")}</h1><p class="mut" style="font-size:1.05rem">${rep} ${L("tiene que confirmar tu horario.<br>Te llegar\u00e1 un aviso cuando est\u00e9 listo.","has to confirm your schedule.<br>You'll get a notification when it's ready.")}</p></div>`);return;}
  if(S.recapDone[c]){h(`<div class="card lock"><div class="ico">✅</div><h1>${L("D\u00eda terminado","Day finished")}</h1><p class="mut" style="font-size:1.05rem">${L("Gracias. El próximo día se abre cuando "+rep+" confirme.","Thanks. The next day opens when "+rep+" confirms.")}</p></div>`);return;}
  const left=jobs.filter(j=>!j.done).length;
  if(S.crewNotifs[c])h(`<div class="card" style="border-left:5px solid var(--acc)">🔔 <b>${esc(S.crewNotifs[c]+" — "+L("Tus trabajos de mañana están listos.","Your jobs for tomorrow are ready."))}</b></div>`);
  h(`<div class="step">${L(DAYS[TOM]+" nov",DAYS_EN[TOM])} · ${esc(C.name)}</div><h1>${left?L("Tus trabajos","Your jobs"):L("¡Todos los trabajos completos!","All jobs complete!")}</h1>`);
  jobs.forEach((j,i)=>{const d=h(`<button class="job" ${j.done?'style="opacity:.55"':""}><div class="a">${j.done?"✅":j.checkedIn?"▶️":(i+1)+"."} ${esc(j.addr)}</div><div class="s">${j.done?L("Trabajo completo","Job complete"):j.checkedIn?L("Toca para seguir","Tap to continue"):L("Toca para ir y registrar llegada","Tap to go and check in")}</div></button>`);
    d.querySelector("button").onclick=()=>{if(j.done)return;j.checkedIn?(S.openJob=j.id,go()):checkin(j);};});
  const load={};jobs.forEach(j=>j.load.forEach(([m,q,u])=>{const k=m+"|"+u;load[k]=(load[k]||0)+Number(String(q).replace(/,/g,""));}));
  h('<details class="card"><summary>'+L("\ud83d\ude9a Ticket de carga \u2014 qu\u00e9 subir al cami\u00f3n","\ud83d\ude9a Load ticket \u2014 what goes on the truck")+'</summary><table>'+Object.entries(load).map(([k,q])=>{const[m,u]=k.split("|");return`<tr><td>${esc(tr(m))}</td><td style="text-align:right"><b>${q.toLocaleString()}</b> ${tr(u)}</td></tr>`;}).join("")+'</table></details>');
  if(!left){const r=h(`<button class="p big">${L("\ud83d\udcdd Terminar el d\u00eda","\ud83d\udcdd Finish the day")}</button><p class="mut" style="text-align:center">${L("Necesario para ver el pr\u00f3ximo d\u00eda.","Needed to see the next day.")}</p>`);r.querySelector("button").onclick=()=>recap(c);}
  const o=h(`<div style="text-align:center"><button class="link">${S.offline?L("\u26a0\ufe0f Sin conexi\u00f3n \u00b7 ","\u26a0\ufe0f Offline \u00b7 ")+S.queue+L(" en cola \u2014 tocar para reconectar"," queued \u2014 tap to reconnect"):L("Demo: simular sin conexi\u00f3n","Demo: simulate offline")}</button></div>`);
  o.querySelector("button").onclick=()=>{S.offline=!S.offline;if(!S.offline&&S.queue){toast(L("Sincronizado","Synced")+" ("+S.queue+")");S.queue=0;}go();};
}
function checkin(j){
  sheet(`<h1>${L("\ud83d\udccd Registrar llegada","\ud83d\udccd Check in")}</h1><p style="font-size:1.05rem"><b>${esc(j.addr)}</b></p><p class="mut">${L("Tienes que estar a menos de 0.5 millas.","You must be within 0.5 miles.")}</p>
   <a href="https://maps.google.com/?q=${encodeURIComponent(j.addr)}" target="_blank" style="font-size:1.05rem">${L("\ud83e\udded Abrir ruta en mapas","\ud83e\udded Open route in maps")}</a>
   <button class="ok big" data-m="0.1">${L("\ud83d\udccd Ya llegu\u00e9","\ud83d\udccd I'm here")}</button><div class="res" style="margin-top:10px"></div>
   <button class="link" data-m="2.3">${L("Demo: probar estando lejos (2.3 mi)","Demo: try from far away (2.3 mi)")}</button>`,m=>m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const mi=+b.dataset.m;
     if(mi<=0.5){j.checkedIn=true;j.checkinMiles=mi;if(S.offline)S.queue++;m.remove();S.openJob=j.id;toast(L("✅ Llegada registrada","✅ Checked in"));go();}
     else m.querySelector(".res").innerHTML='<b style="color:var(--bad);font-size:1.05rem">'+L("Estás a "+mi+" millas. Acércate a la obra.","You're "+mi+" miles away. Get closer to the job.")+'</b>';}));
}
const LAB_ES={s:"Un poco más",m:"Bastante más",l:"Mucho más",x:"Muchísimo más"},LAB_EN={s:"a little more",m:"quite a bit more",l:"a lot more",x:"way more"};
const LAB_USD={s:25,m:50,l:100,x:null}; // office-only mapping; "x" → office types amount over $100
function crewJob(c,j){
  const rep=CREWS[c].rep;
  h('<button class="link" style="font-size:1rem">'+L("\u2190 Mis trabajos","\u2190 My jobs")+'</button>').querySelector("button").onclick=()=>{S.openJob=null;go();};
  h(`<div class="card"><h1 style="margin-top:0">${esc(j.addr)}</h1><div style="font-size:1.05rem">${L("Cliente:","Customer:")} <b>${esc(j.cust)}</b></div>${j.coords?`<a href="https://maps.google.com/?q=${j.coords.replace(/ /g,"")}" target="_blank">📍 ${j.coords}</a>`:""}</div>`);
  h('<div class="card"><div class="step">'+L("1 \u00b7 Orden de trabajo","1 \u00b7 Work order")+'</div><table>'+j.lines.map(l=>`<tr><td><b>${tr(l[0])}</b><br><span class="mut small">${tr(l[1])}</span></td><td style="text-align:right;font-weight:800">${l[2]}</td></tr>`).join("")+'</table></div>');
  const ph=h(`<div class="card"><div class="step">${L("2 \u00b7 Fotos","2 \u00b7 Photos")}</div>
   ${j.nc?`<button class="act ${j.wallPhotos?"done":"need"} wb">${j.wallPhotos?"✅":"📷"} ${L("Fotos de paredes","Walls photos")} ${j.wallPhotos?"("+j.wallPhotos+")":L("\u2014 obligatorio","\u2014 required")}</button>
   <button class="act ${j.crawlPhoto?"done":"need"} cb">${j.crawlPhoto?"✅":"📷"} ${L("Fotos del crawl","Crawl photos")} ${j.crawlPhoto?"":L("\u2014 obligatorio","\u2014 required")}</button>`:""}
   <button class="act gb">📷 ${L("Fotos del trabajo","Job photos")} ${j.photos.length?"("+j.photos.length+")":""}</button>
   <div class="thumbs">${j.photos.map((p,i)=>`<div class="thumb ${p.mk?"mk":""}" data-i="${i}">${p.t}</div>`).join("")}</div>${j.photos.length?'<div class="mut small">'+L("Toca una foto para marcarla \u270e","Tap a photo to mark it up \u270e")+'</div>':""}</div>`);
  const add=t=>{j.photos.push({t,mk:false});if(S.offline)S.queue++;render();};
  ph.querySelector(".gb").onclick=()=>add("Foto");

const PIECE={fiberglass:{label:"Fiberglass",rate:0.08,unit:"SF"},poly:{label:"Poly",rate:0.08,unit:"SF"},rockwool:{label:"Rockwool",rate:0.15,unit:"SF"},
  baffle:{label:"Baffles",rate:0.30,unit:"ea"},polyvent:{label:"Poly vents",rate:0.30,unit:"ea"},prehang:{label:"Prehangs",flat:75,unit:"ea"},
  airseal:{label:"Caulk & foam air seal",flat:75,unit:"job"},removal:{label:"Removal labor",rate:0.25,unit:"SF"}};
function pieceCat(l){const t=(l[0]+" "+l[1]).toLowerCase();
  if(/espuma|foam roof|celda/.test(t)&&!/masilla/.test(t))return null;
  if(/ventila|poly vent/.test(t))return"polyvent";if(/poly/.test(t))return"poly";if(/rockwool|lana de roca/.test(t))return"rockwool";
  if(/baffle|deflector/.test(t))return"baffle";if(/prehang|pre-colg/.test(t))return"prehang";if(/sellado|masilla|air seal/.test(t))return"airseal";
  if(/retiro|remoci|removal/.test(t))return"removal";if(/r-\d|soplado|batt|fibra/.test(t))return"fiberglass";return null;}
function pieceLines(j){j.flat=j.flat||{};return j.lines.map((l,i)=>{const k=pieceCat(l);if(!k)return{i,l,k:null,qty:0,pay:0};const P=PIECE[k],q=Number(String(l[2]).replace(/[^\d.]/g,""))||1;
  if(P.flat){const each=j.flat[i]!=null?j.flat[i]:P.flat,n=k==="airseal"?1:q;return{i,l,k,qty:n,each,pay:each*n,flat:true};}return{i,l,k,qty:q,pay:Math.round(q*P.rate*100)/100};});}
const money=x=>"$"+(Math.round(x*100)/100).toLocaleString(undefined,{minimumFractionDigits:x%1?2:0,maximumFractionDigits:2});
function officeExtra(j,rep){let amt=null;
  sheet(`<h1>Add extra labor</h1><p class="mut">${esc(CREWS[j.crew].name)} · ${esc(j.addr)}<br>Goes straight onto payroll as approved. The crew sees a notice, never the amount.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${[25,50,100].map(v=>`<button class="am" data-v="${v}" style="flex:1">$${v}</button>`).join("")}<button class="am" data-v="c" style="flex:1">Custom</button></div>
   <div class="cu" hidden><label>Amount</label><input class="ca" inputmode="decimal" placeholder="150"></div>
   <label>Short reason</label><input class="rs" placeholder="e.g. tight attic, extra prep">
   <button class="act ph">📷 Photo (optional)</button><button class="ok big go">Add to payroll</button>`,m=>{let ph=false;
   m.querySelectorAll(".am").forEach(b=>b.onclick=()=>{amt=b.dataset.v;m.querySelectorAll(".am").forEach(x=>{x.style.background=x===b?"var(--ink)":"";x.style.color=x===b?"var(--bg)":"";});m.querySelector(".cu").hidden=amt!=="c";});
   m.querySelector(".ph").onclick=e=>{ph=true;e.target.textContent="✅ Photo added";};
   m.querySelector(".go").onclick=()=>{const a=amt==="c"?Number(m.querySelector(".ca").value):Number(amt),r=m.querySelector(".rs").value.trim();
     if(!(a>0))return toast("Pick an amount");if(!r)return toast("Add a short reason");
     j.labor.push({office:true,amt:a,en:r,es:r,status:"approved",crew:j.crew,photo:ph,by:REPS[rep]});m.remove();toast("Extra labor added for "+CREWS[j.crew].name);go();};});}
function oPayroll(rep,mine){
  h(`<h1>Weekly payroll</h1><p class="mut small">Week of Nov 2 · Subs: piece rate from the work order + gas + extra labor. Gas from ${OFFICE_LABEL}: under 40 mi $0 · 40–60 mi $25 · 60+ mi $50. Crews never see dollars.</p>`);
  mine.forEach(c=>{const js=S.jobs.filter(j=>j.crew===c&&j.day>=0&&j.day<6);let gm=0,lb=0;
    const emp=CREWS[c].type==="emp";let pr=0;
    const rows=js.map(j=>{const g=mileTier(j.miles),l=j.labor.filter(x=>x.status==="approved").reduce((s,x)=>s+(x.amt||0),0);gm+=g;lb+=l;
      const pl=emp?[]:pieceLines(j),pj=pl.reduce((s,x)=>s+x.pay,0);pr+=pj;
      const det=emp?"":`<details><summary class="small" style="min-height:36px">Piece rate ${money(pj)} — details</summary><table class="small">${pl.map(x=>x.k?`<tr><td>${esc(PIECE[x.k].label)}<br><span class="mut">${esc(tr(x.l[0]))}</span></td><td>${x.flat?`${x.qty} × <input class="fl" data-j="${j.id}" data-i="${x.i}" value="${x.each}" inputmode="decimal" style="width:70px;padding:6px">`:`${x.qty.toLocaleString()} ${PIECE[x.k].unit} × ${money(PIECE[x.k].rate)}`}</td><td style="text-align:right">${money(x.pay)}</td></tr>`:`<tr><td colspan="2" class="mut">${esc(tr(x.l[0]))} — ${esc(tr(x.l[1]))} (not on sub rate sheet)</td><td></td></tr>`).join("")}</table></details>`;
      const ex=j.labor.filter(x=>x.status==="approved").map(x=>`<div class="small mut">+ ${money(x.amt)} ${x.office?"added by "+esc(x.by||"office"):"crew request"} — ${esc(x.en)}</div>`).join("");
      return`<tr><td>${DAYS_EN[j.day].split(" ")[0]}</td><td>${esc(j.addr.split(",")[0])}<br><span class="mut small">${j.miles} mi</span>${det}${ex}<button class="link ox" data-j="${j.id}">＋ Add extra labor</button></td>${emp?"":`<td>${money(pj)}</td>`}<td>$${g}</td><td>$${l}</td></tr>`;}).join("");
    h(`<div class="card"><h2>${esc(CREWS[c].name)} ${typeTag(c)}</h2>
     <p class="small mut" style="margin:0 0 6px">${emp?"Employee (hourly / salary, in training) — not piece rate. Gas + extra labor shown for reference; base pay comes from timesheet.":"Sub crew — paid piece rate per job + gas + approved extra labor."}</p>
     <table><tr><th>Day</th><th>Job</th>${emp?"":"<th>Piece</th>"}<th>Gas</th><th>Extra</th></tr>${rows}<tr><th></th><th>Total</th>${emp?"":`<th>${money(pr)}</th>`}<th>$${gm}</th><th>$${lb}</th></tr></table>
     <p style="font-size:1.15rem;margin:10px 0 0"><b>${emp?"Add-ons this week: "+money(gm+lb):"Total this week: "+money(pr+gm+lb)}</b>${emp?' <span class="mut small">+ hourly pay from timesheet</span>':""}</p></div>`);});
  document.querySelectorAll(".ox").forEach(b=>b.onclick=()=>officeExtra(S.jobs.find(x=>x.id===+b.dataset.j),rep));
  document.querySelectorAll(".fl").forEach(i=>i.onchange=()=>{const j=S.jobs.find(x=>x.id===+i.dataset.j);j.flat=j.flat||{};j.flat[i.dataset.i]=Number(i.value)||0;go();});
  h(`<details class="card"><summary>Sub piece rates (Jorge, Santos)</summary><table class="small">${Object.values(PIECE).map(P=>`<tr><td>${P.label}</td><td>${P.flat?"$"+P.flat+" default per "+(P.unit==="job"?"house":"each")+" — edit per job by size":money(P.rate)+" / "+P.unit}</td></tr>`).join("")}</table><p class="mut small">Sammy is an employee in training — not piece rate.</p></details>`);
}
function oMore(rep){
  const P=S.notifPrefs[rep],L={ready:"Crew notified when I confirm",labor:"Extra labor requested",short:"Material problem (immediate)",photo:"Job completed with no photos",complete:"Job completed / day recap"};
  const d=h(`<h1>Settings</h1><div class="card"><h2>📲 Push me for…</h2>${Object.keys(L).map(k=>`<label style="display:flex;gap:12px;align-items:center;font-weight:600;min-height:48px;margin:0"><input type="checkbox" data-k="${k}" ${P[k]?"checked":""} style="width:26px;height:26px"> ${L[k]}</label>`).join("")}
   <label>Afternoon reminder</label><div style="display:flex;gap:8px"><button class="rm" style="flex:1;background:var(--ink);color:var(--bg)">5:00 PM</button><button class="rm" style="flex:1">6:00 PM</button></div></div>
   <div class="card"><h2>Crews</h2>${Object.keys(CREWS).filter(k=>CREWS[k].rep===rep).map(c=>`<div style="min-height:40px">${esc(CREWS[c].name)} ${typeTag(c)}</div>`).join("")}</div>
   <button class="link rs">Reset preview data</button>`);
  d.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>{P[i.dataset.k]=i.checked;});
  d.querySelectorAll(".rm").forEach(b=>b.onclick=()=>d.querySelectorAll(".rm").forEach(x=>{x.style.background=x===b?"var(--ink)":"";x.style.color=x===b?"var(--bg)":"";}));
  d.querySelector(".rs").onclick=()=>{S=fresh();toast("Preview reset");go();};
}
fillWho();
const langBtn=$("#lang");const setLangLbl=()=>{langBtn.textContent=LANG==="es"?"Crew: Español → EN":"Crew: English → ES";};setLangLbl();
langBtn.onclick=()=>{LANG=LANG==="es"?"en":"es";try{localStorage.setItem("kpPrevLang",LANG);}catch(e){}setLangLbl();render();};
render();
</script></body></html>
